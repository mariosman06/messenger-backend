<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Messenger Backend Tester</title>
  <style>
    :root { --bg: #121212; --card: #1e1e1e; --accent: #009688; --text: #e0e0e0; --border: #333; }
    body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
    h2, h3 { margin-top: 0; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 20px; margin-bottom: 20px; }
    label { display: block; margin-top: 10px; font-size: 0.85rem; color: #aaa; }
    input, button { width: 100%; padding: 10px; margin-top: 4px; background: #2a2a2a; border: 1px solid var(--border); color: #fff; border-radius: 6px; box-sizing: border-box; }
    button { background: var(--accent); border: none; font-weight: bold; cursor: pointer; margin-top: 8px; }
    button:hover { opacity: 0.9; }
    button.danger { background: #d32f2f; }
    button.secondary { background: #444; }
    #log { background: #0a0a0a; border: 1px solid var(--border); height: 750px; overflow-y: auto; padding: 12px; font-family: monospace; font-size: 0.85rem; border-radius: 6px; color: #4caf50; }
    .status { display: inline-block; padding: 4px 8px; border-radius: 4px; font-size: 0.8rem; font-weight: bold; }
    .status.connected { background: #2e7d32; color: #fff; }
    .status.disconnected { background: #c62828; color: #fff; }
    .log-entry { margin-bottom: 8px; border-bottom: 1px solid #222; padding-bottom: 4px; word-break: break-all; }
    .flex { display: flex; gap: 10px; }
  </style>
</head>
<body>

  <h1>Messenger Backend Test Client</h1>

  <div class="grid">
    <div>
      <!-- 1. Global Setup & Auth Card -->
      <div class="card">
        <h3>1. Authentication & Session</h3>
        <label>API Base URL</label>
        <input type="text" id="baseUrl" value="http://localhost:8008">

        <div class="flex">
          <div style="flex: 1;">
            <label>Username / Email</label>
            <input type="text" id="authUsername" value="user1">
          </div>
          <div style="flex: 1;">
            <label>Password</label>
            <input type="password" id="authPassword" value="password123">
          </div>
        </div>

        <div class="flex">
          <button onclick="registerUser()">Register</button>
          <button onclick="loginUser()" class="secondary">Login</button>
        </div>

        <label>Active JWT Token</label>
        <input type="text" id="jwtToken" placeholder="Auto-filled upon login..." readonly>
        
        <label>Active User ID</label>
        <input type="text" id="currentUserId" placeholder="Auto-filled upon login..." readonly>
      </div>

      <!-- 2. WebSocket Control Card -->
      <div class="card">
        <h3>2. Real-Time WebSocket <span id="wsStatus" class="status disconnected">Disconnected</span></h3>
        <label>WebSocket Connection URL</label>
        <input type="text" id="wsUrl" value="ws://localhost:8008/ws">
        <button id="connectBtn" onclick="toggleWS()">Connect WebSocket</button>
      </div>

      <!-- 3. Direct Message Action Card -->
      <div class="card">
        <h3>3. Direct Messaging (REST API)</h3>
        <label>Recipient User ID</label>
        <input type="text" id="recipientId" placeholder="Paste target user UUID here">
        
        <label>Message Content</label>
        <input type="text" id="msgContent" value="Hello via Redis Pub/Sub!">
        
        <button onclick="sendDM()">Send Direct Message</button>
      </div>

      <!-- 4. Friendships & Requests Card -->
      <div class="card">
        <h3>4. Friendships & Requests</h3>
        <label>Target User UUID (Addressee / Requester)</label>
        <input type="text" id="friendTargetId" placeholder="Paste target user UUID here">

        <div class="flex">
          <button onclick="sendFriendRequest()">Send Request</button>
          <button onclick="acceptFriendRequest()" class="secondary">Accept Request</button>
        </div>
        
        <div class="flex">
          <button onclick="listPendingRequests()" class="secondary">Pending Requests</button>
          <button onclick="listFriends()" class="secondary">List All Friends</button>
        </div>

        <div class="flex">
          <button onclick="getFriendStatus()" class="secondary">Get Status</button>
          <button onclick="removeOrDeclineFriend()" class="danger">Remove / Decline</button>
        </div>
      </div>
    </div>

    <!-- Right Column: Live Event Log -->
    <div class="card" style="position: sticky; top: 20px;">
      <h3>Live Event & Network Log</h3>
      <button onclick="clearLog()" class="secondary" style="margin-bottom: 10px;">Clear Log</button>
      <div id="log"></div>
    </div>
  </div>

  <script>
    let ws = null;

    const getBaseUrl = () => document.getElementById('baseUrl').value.replace(/\/$/, '');
    const getWsBaseUrl = () => getBaseUrl().replace(/^http/, 'ws');

    function parseAuthResponse(data) {
      const token = data.tokens?.access_token || data.access_token || data.token;
      const userId = data.user?.user_id || data.user_id || data.id;

      if (token) document.getElementById('jwtToken').value = token;
      if (userId) document.getElementById('currentUserId').value = userId;

      if (token) {
        document.getElementById('wsUrl').value = `${getWsBaseUrl()}/ws?token=${token}`;
        appendLog('[SYSTEM] Auth token captured & WebSocket URL synced!');
      } else {
        appendLog('[SYSTEM ERROR] Response received but token key missing.');
      }
    }

    // 1. REGISTER
    async function registerUser() {
      const username = document.getElementById('authUsername').value;
      const password = document.getElementById('authPassword').value;

      try {
        const res = await fetch(`${getBaseUrl()}/auth/register`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        appendLog(`[REGISTER ${res.status}] ${JSON.stringify(data, null, 2)}`);
        
        if (res.ok) {
          parseAuthResponse(data);
        }
      } catch (err) {
        appendLog(`[REGISTER ERROR] ${err.message}`);
      }
    }

    // 2. LOGIN
    async function loginUser() {
      const username = document.getElementById('authUsername').value;
      const password = document.getElementById('authPassword').value;

      try {
        const res = await fetch(`${getBaseUrl()}/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        appendLog(`[LOGIN ${res.status}] ${JSON.stringify(data, null, 2)}`);

        if (res.ok) {
          parseAuthResponse(data);
        }
      } catch (err) {
        appendLog(`[LOGIN ERROR] ${err.message}`);
      }
    }

    // 3. WEBSOCKET HANDLER
    function toggleWS() {
      if (ws) {
        ws.close();
        return;
      }

      const url = document.getElementById('wsUrl').value;
      ws = new WebSocket(url);

      ws.onopen = () => {
        updateStatus(true);
        appendLog('[WS SYSTEM] WebSocket connection established.');
      };

      ws.onmessage = (event) => {
        try {
          const parsed = JSON.parse(event.data);
          appendLog(`[WS RECEIVE] ${JSON.stringify(parsed, null, 2)}`);
        } catch {
          appendLog(`[WS RECEIVE RAW] ${event.data}`);
        }
      };

      ws.onerror = () => appendLog(`[WS ERROR] Real-time connection error.`);

      ws.onclose = () => {
        updateStatus(false);
        appendLog('[WS SYSTEM] Connection closed.');
        ws = null;
      };
    }

    function updateStatus(connected) {
      const statusEl = document.getElementById('wsStatus');
      const btn = document.getElementById('connectBtn');
      if (connected) {
        statusEl.textContent = 'Connected';
        statusEl.className = 'status connected';
        btn.textContent = 'Disconnect WebSocket';
        btn.className = 'danger';
      } else {
        statusEl.textContent = 'Disconnected';
        statusEl.className = 'status disconnected';
        btn.textContent = 'Connect WebSocket';
        btn.className = '';
      }
    }

    // 4. SEND DIRECT MESSAGE
    async function sendDM() {
      const token = document.getElementById('jwtToken').value;
      const recipient_id = document.getElementById('recipientId').value;
      const content = document.getElementById('msgContent').value;

      if (!token) return alert('Please log in first!');

      try {
        const res = await fetch(`${getBaseUrl()}/messages/direct`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({ recipient_id, content })
        });
        const data = await res.json();
        appendLog(`[HTTP POST DM ${res.status}] ${JSON.stringify(data, null, 2)}`);
      } catch (err) {
        appendLog(`[HTTP ERROR] ${err.message}`);
      }
    }

    // 5. FRIENDSHIP ACTIONS
    async function sendFriendRequest() {
      const token = document.getElementById('jwtToken').value;
      const addressee_id = document.getElementById('friendTargetId').value;

      if (!token) return alert('Please log in first!');
      if (!addressee_id) return alert('Please enter a Target User UUID!');

      try {
        const res = await fetch(`${getBaseUrl()}/friends/requests`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({ addressee_id })
        });
        const data = await res.json();
        appendLog(`[POST FRIEND REQ ${res.status}] ${JSON.stringify(data, null, 2)}`);
      } catch (err) {
        appendLog(`[FRIEND ERROR] ${err.message}`);
      }
    }

    async function acceptFriendRequest() {
      const token = document.getElementById('jwtToken').value;
      const requester_id = document.getElementById('friendTargetId').value;

      if (!token) return alert('Please log in first!');
      if (!requester_id) return alert('Please enter the Requester User UUID!');

      try {
        const res = await fetch(`${getBaseUrl()}/friends/requests/${requester_id}/accept`, {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const data = await res.json();
        appendLog(`[POST ACCEPT FRIEND ${res.status}] ${JSON.stringify(data, null, 2)}`);
      } catch (err) {
        appendLog(`[FRIEND ERROR] ${err.message}`);
      }
    }

    async function listPendingRequests() {
      const token = document.getElementById('jwtToken').value;
      if (!token) return alert('Please log in first!');

      try {
        const res = await fetch(`${getBaseUrl()}/friends/requests/pending`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const data = await res.json();
        appendLog(`[GET PENDING REQS ${res.status}] ${JSON.stringify(data, null, 2)}`);
      } catch (err) {
        appendLog(`[FRIEND ERROR] ${err.message}`);
      }
    }

    async function listFriends() {
      const token = document.getElementById('jwtToken').value;
      if (!token) return alert('Please log in first!');

      try {
        const res = await fetch(`${getBaseUrl()}/friends`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const data = await res.json();
        appendLog(`[GET FRIENDS ${res.status}] ${JSON.stringify(data, null, 2)}`);
      } catch (err) {
        appendLog(`[FRIEND ERROR] ${err.message}`);
      }
    }

    async function getFriendStatus() {
      const token = document.getElementById('jwtToken').value;
      const target_id = document.getElementById('friendTargetId').value;

      if (!token) return alert('Please log in first!');
      if (!target_id) return alert('Please enter a Target User UUID!');

      try {
        const res = await fetch(`${getBaseUrl()}/friends/${target_id}/status`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const data = await res.json();
        appendLog(`[GET STATUS ${res.status}] ${JSON.stringify(data, null, 2)}`);
      } catch (err) {
        appendLog(`[FRIEND ERROR] ${err.message}`);
      }
    }

    async function removeOrDeclineFriend() {
      const token = document.getElementById('jwtToken').value;
      const target_id = document.getElementById('friendTargetId').value;

      if (!token) return alert('Please log in first!');
      if (!target_id) return alert('Please enter a Target User UUID!');

      try {
        const res = await fetch(`${getBaseUrl()}/friends/${target_id}`, {
          method: 'DELETE',
          headers: { 'Authorization': `Bearer ${token}` }
        });

        if (res.status === 204) {
          appendLog(`[DELETE FRIEND 204] Successfully removed relationship / declined request.`);
        } else {
          const data = await res.json();
          appendLog(`[DELETE FRIEND ${res.status}] ${JSON.stringify(data, null, 2)}`);
        }
      } catch (err) {
        appendLog(`[FRIEND ERROR] ${err.message}`);
      }
    }

    function appendLog(text) {
      const log = document.getElementById('log');
      const entry = document.createElement('div');
      entry.className = 'log-entry';
      entry.textContent = text;
      log.appendChild(entry);
      log.scrollTop = log.scrollHeight;
    }

    function clearLog() {
      document.getElementById('log').innerHTML = '';
    }
  </script>
</body>
</html>
