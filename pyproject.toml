[project]
name = "messenger-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "pydantic>=2.13.5",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pyyaml>=6.0.3",
    "redis>=8.1.0",
    "ruff>=0.16.6",
    "tenacity>=9.1.4",
    "testcontainers[postgres]>=4.15.0",
    "uvicorn>=0.52.4",
]


[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
log_cli = true
log_cli_level = "ERROR"


[tool.ruff]
target-version = "py313"
line-length = 95

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes (logic/syntax)
    "I",    # isort (import sorting)
    "B",    # flake8-bugbear (common design flaws)
    "UP",   # pyupgrade (modern syntax)
    "S",    # flake8-bandit (security) 
    "ASYNC",# flake8-async (checks for blocking calls in async def)
    "RUF"   # Ruff-specific rules
]

ignore = [
    "E501",
    "B008",
    "RUF029",
    "S101",
    "S105",
    "S107"
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
